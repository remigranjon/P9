<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patients</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar">
        <a th:href="@{/}">Accueil</a>
        <a th:href="@{/patients}">Patients</a>
        <a th:href="@{/register}">Ajouter un utilisateur</a>
        <a th:href="@{/logout}">Se déconnecter</a>
    </nav>

    <main class="page-shell">
        <h1 class="page-title">Liste des patients</h1>

        <div th:if="${error}" class="error-message">
            <p th:text="${error}"></p>
        </div>

        <section th:if="${patients}" class="section-card">
            <h2 class="section-title">Patients enregistrés</h2>

            <table class="info-table">
                <thead>
                    <tr>
                        <th>Prénom</th>
                        <th>Nom</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="patient : ${patients}">
                        <td th:text="${patient.firstName}"></td>
                        <td th:text="${patient.lastName}"></td>
                        <td class="note-actions"> 
                            <a class="action-link secondary"
                                th:href="@{/patients/{id}(id=${patient.id})}"> Détails </a>
                            <form th:action="@{/patients/{id}/delete(id=${patient.id})}" method="post"
                                onsubmit="return confirm('Supprimer ce patient ?');">
                                <button type="submit" class="action-button danger-button">Supprimer</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="actions-row">
                <a class="action-link" th:href="@{/patients/add}">
                    Ajouter un patient
                </a>
            </div>
        </section>
    </main>
</body>

</html>
